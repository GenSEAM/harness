<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50" />
      <stop offset="100%" style="stop-color:#fd746c" />
    </linearGradient>
  </defs>
  
  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)" />
  
  <!-- Sun -->
  <circle cx="400" cy="300" r="60" fill="#ffce54" />
  
  <!-- Far Mountains -->
  <polygon points="0,400 200,200 400,400 600,150 800,400 800,600 0,600" fill="#4b6584" />
  
  <!-- Middle Mountains -->
  <polygon points="0,450 250,250 500,450 700,300 800,450 800,600 0,600" fill="#2d4059" />
  
  <!-- River -->
  <rect x="0" y="450" width="800" height="150" fill="#1a2a6c" />
  
  <!-- Reflection of Sun -->
  <ellipse cx="400" cy="480" rx="60" ry="20" fill="#ffce54" opacity="0.3" />
  
  <!-- River Ripples -->
  <rect x="300" y="500" width="200" height="2" fill="white" opacity="0.2" />
  <rect x="350" y="520" width="100" height="2" fill="white" opacity="0.2" />
  <rect x="320" y="540" width="160" height="2" fill="white" opacity="0.2" />
</svg>
