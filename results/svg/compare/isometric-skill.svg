<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Soft Drop Shadows -->
  <g fill="#111" opacity="0.3">
    <path d="M 100 150 L 100 170 L 200 220 L 200 200 Z"/>
    <path d="M 200 280 L 200 310 L 300 360 L 300 330 Z" fill="#000" opacity="0.2"/>
  </g>

  <!-- Top Slab 1 -->
  <g stroke="#000" stroke-width="0.8">
    <path d="M 200 100 L 300 150 L 200 200 L 100 150 Z" fill="#3a3a3a"/>
    <path d="M 200 100 L 200 130 L 300 180 L 300 150 Z" fill="#4a4a4a"/>
    <path d="M 300 150 L 300 180 L 200 230 L 200 200 Z" fill="#222222"/>
  </g>

  <!-- Middle Slab 2 -->
  <g stroke="#000" stroke-width="0.8">
    <path d="M 200 140 L 300 190 L 200 240 L 100 190 Z" fill="#333333"/>
    <path d="M 200 140 L 200 170 L 300 220 L 300 190 Z" fill="#444444"/>
    <path d="M 300 190 L 300 220 L 200 270 L 200 240 Z" fill="#1e1e1e"/>
  </g>

  <!-- Bottom Slab 3 -->
  <g stroke="#000" stroke-width="0.8">
    <path d="M 200 180 L 300 230 L 200 280 L 100 230 Z" fill="#2c2c2c"/>
    <path d="M 200 180 L 200 210 L 300 260 L 300 230 Z" fill="#3d3d3d"/>
    <path d="M 300 230 L 300 260 L 200 310 L 200 280 Z" fill="#181818"/>
  </g>

  <!-- Glowing Cyan Network Activity LEDs -->
  <g fill="#00ffff" opacity="0.9">
    <circle cx="220" cy="155" r="2.5"/>
    <circle cx="230" cy="160" r="2.5"/>
    <circle cx="240" cy="165" r="2.5"/>

    <circle cx="220" cy="195" r="2.5"/>
    <circle cx="230" cy="200" r="2.5"/>
    <circle cx="240" cy="205" r="2.5"/>

    <circle cx="220" cy="235" r="2.5"/>
    <circle cx="230" cy="240" r="2.5"/>
    <circle cx="240" cy="245" r="2.5"/>
  </g>
</svg>
